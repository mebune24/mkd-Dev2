name: SpaceRentals CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: TypeScript lint + build ────────────────────────────────────────
  backend-check:
    name: 🔧 Backend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (no DB needed)
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Frontend: Flutter analyze + build APK ───────────────────────────────────
  flutter-check:
    name: 📱 Flutter (Analyze + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "API_BASE_URL=https://api.spacerentals.app" > .env
          echo "APP_ENV=production" >> .env

      - name: Flutter analyze (errors only)
        run: flutter analyze --no-congratulate 2>&1 | grep "^error" && exit 1 || echo "✅ No analysis errors"

      - name: Build release APK
        if: github.ref == 'refs/heads/main'
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=https://api.spacerentals.app
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: spacerentals-release-${{ github.sha }}
          path: Frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── Security: Dependency audit ───────────────────────────────────────────────
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity only)
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't fail CI on audit warnings, just surface them
